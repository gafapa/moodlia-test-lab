name: Build golden images

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: moodle-local_moodlia ref installed in the moodlia variant
        default: main
      versions:
        description: Comma-separated Moodle versions to build (empty builds all)
        default: ''
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          VERSIONS: ${{ github.event.inputs.versions || '' }}
        run: |
          echo "matrix=$(jq -c --arg only "$VERSIONS" '[to_entries[] | select($only == "" or ([.key] | inside($only | split(",")))) | {version: .key, tag: .value}]' images/versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.versions.outputs.matrix) }}
        variant: [core, moodlia]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the MoodlIA plugin
        if: matrix.variant == 'moodlia'
        uses: actions/checkout@v4
        with:
          repository: gafapa/moodle-local_moodlia
          ref: ${{ github.event.inputs.plugin_ref || github.event.client_payload.ref || 'main' }}
          path: plugin
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.site.version }}-${{ matrix.variant }}
        run: bash images/build.sh "${{ matrix.site.tag }}" "${{ matrix.variant }}" "ghcr.io/${{ github.repository_owner }}/moodlia-lab:${{ matrix.site.version }}-${{ matrix.variant }}" plugin
      - name: Smoke-test the image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/moodlia-lab:${{ matrix.site.version }}-${{ matrix.variant }}"
          docker run -d --name smoke -p 127.0.0.1:18080:8080 -e SITE_URL=http://127.0.0.1:18080 -e REVERSEPROXY=true -e DB_TYPE=sqlite3 -e MOODLE_DATABASE_TYPE=sqlite3 "$image"
          for _ in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break; sleep 3; done
          echo "health: $(docker inspect -f '{{.State.Health.Status}}' smoke)"
          fixture="$(docker exec smoke php /opt/moodlia-lab/runtime.php "${{ matrix.variant }}" | tail -n 1)"
          token="$(jq -r .token <<< "$fixture")"
          echo "::add-mask::$token"
          jq 'del(.token)' <<< "$fixture"
          # Each variant's token only reaches its own service: every Core function, or local_moodlia.
          if [ "${{ matrix.variant }}" = core ]; then function=core_webservice_get_site_info; else function=local_moodlia_get_moodlia_status; fi
          info="$(curl -fsS -d "wstoken=$token&wsfunction=$function&moodlewsrestformat=json" \
            http://127.0.0.1:18080/webservice/rest/server.php)"
          if ! jq -e 'type == "object" and (has("exception") | not)' <<< "$info" >/dev/null; then
            jq '{exception, errorcode, message, debuginfo}' <<< "$info" || head -c 2000 <<< "$info"
            docker logs --tail 80 smoke
            exit 1
          fi
          docker rm -f smoke
      - name: Push
        run: docker push "ghcr.io/${{ github.repository_owner }}/moodlia-lab:${{ matrix.site.version }}-${{ matrix.variant }}"
